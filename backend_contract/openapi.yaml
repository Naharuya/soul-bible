openapi: 3.1.0
info:
  title: Bible Mind LLM Proxy
  version: 0.3.0
paths:
  /v1/mind/chat:
    post:
      summary: Generate one safe conversation turn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      responses:
        '200':
          description: Structured conversation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
components:
  schemas:
    ConversationRequest:
      type: object
      required: [session, userMessage, systemPromptVersion, allowedVerseIds, locale]
      properties:
        session:
          type: object
          additionalProperties: true
        userMessage:
          type: string
          minLength: 1
          maxLength: 2000
        systemPromptVersion:
          type: string
        allowedVerseIds:
          type: array
          items: { type: string }
        locale:
          type: string
    ConversationResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - question
        - stage
        - detectedEmotion
        - secondaryEmotion
        - riskLevel
        - shouldOfferVerse
        - verseTags
        - actionTags
        - shouldEndConversation
        - suggestedVerseId
      properties:
        message: { type: string }
        question: { type: [string, "null"] }
        stage:
          enum: [emotion, situation, thought, need, verse_offer, verse_reflection, action, summary, crisis]
        detectedEmotion:
          enum: [불안, 외로움, 지침, 분노, 슬픔, 복잡함, 감사, 기타]
        secondaryEmotion: { type: [string, "null"] }
        riskLevel: { type: integer, minimum: 0, maximum: 3 }
        shouldOfferVerse: { type: boolean }
        verseTags:
          type: array
          items: { type: string }
        actionTags:
          type: array
          items: { type: string }
        shouldEndConversation: { type: boolean }
        suggestedVerseId: { type: [string, "null"] }
