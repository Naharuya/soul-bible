name: rami_mvp
description: RAMI - NFC picture card play MVP for pre-reading children.
publish_to: 'none'
version: 0.4.0+5

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  nfc_manager: ^4.2.1
  app_links: ^7.2.1
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
