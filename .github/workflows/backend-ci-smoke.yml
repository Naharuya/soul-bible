name: Backend CI Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOUL_AI_MODE: local
      SOUL_EXTERNAL_API_DISABLED: 'true'
      OPENAI_API_KEY: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Run backend tests without live providers
        run: npm test
