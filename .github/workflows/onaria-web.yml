name: ONARIA Web and Admin
on:
  workflow_dispatch:
  pull_request:
    paths: ['backend/**', '.github/workflows/onaria-web.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/onaria-web.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      SOUL_AI_MODE: local
      SOUL_EXTERNAL_API_DISABLED: 'true'
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onaria-web-results
          path: build/onaria-web-results
          if-no-files-found: ignore
