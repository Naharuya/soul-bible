name: Mac mini phone auto-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Security: intentionally never runs on pull_request events.
# This repository is public, so the self-hosted runner must only accept trusted
# main pushes/manual dispatches and must not be exposed to untrusted PR code.
concurrency:
  group: onaria-macmini-phone-deploy
  cancel-in-progress: true

jobs:
  deploy-android-phone:
    runs-on: [self-hosted, macOS, ARM64, onaria-deploy]
    timeout-minutes: 45
    env:
      SOUL_AI_MODE: local
      SOUL_EXTERNAL_API_DISABLED: 'true'
      OPENAI_API_KEY: ''
      ANDROID_HOME: /Users/server/Library/Android/sdk
      ANDROID_SDK_ROOT: /Users/server/Library/Android/sdk
      ONARIA_ANDROID_PACKAGE: com.example.bible_mind_core
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/Users/server/Library/Android/sdk/platform-tools

    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 1

      - name: Debug deployment preflight
        shell: bash
        run: bash scripts/macmini-deploy-preflight.sh --debug

      - name: Run Flutter regression tests
        shell: bash
        run: flutter test

      - name: Analyze ONARIA app
        shell: bash
        run: flutter analyze lib test example --no-fatal-infos

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --debug
          test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Verify exactly one authorized Android phone
        id: phone
        shell: bash
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" start-server
          mapfile -t DEVICES < <("$ADB" devices | awk '$2=="device" {print $1}')
          if [[ "${#DEVICES[@]}" -ne 1 ]]; then
            echo "Expected exactly one authorized Android device, found ${#DEVICES[@]}." >&2
            "$ADB" devices -l
            exit 1
          fi
          echo "serial=${DEVICES[0]}" >> "$GITHUB_OUTPUT"
          echo "Authorized Android device: ${DEVICES[0]}"

      - name: Update ONARIA on connected phone without deleting app data
        shell: bash
        env:
          DEVICE_SERIAL: ${{ steps.phone.outputs.serial }}
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          "$ADB" -s "$DEVICE_SERIAL" install -r "$APK"

      - name: Launch ONARIA
        shell: bash
        env:
          DEVICE_SERIAL: ${{ steps.phone.outputs.serial }}
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" -s "$DEVICE_SERIAL" shell monkey \
            -p "$ONARIA_ANDROID_PACKAGE" \
            -c android.intent.category.LAUNCHER 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo "ONARIA Mac mini debug deployment finished."
          echo "Package: $ONARIA_ANDROID_PACKAGE"
          echo "Commit: $GITHUB_SHA"
