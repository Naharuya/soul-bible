<VirtualHost *:80>
    ServerName lightshare8.mycafe24.com
    # Reject plaintext API requests. Enable a separately verified TLS vhost first.
    <Location />
        Require all denied
    </Location>
    ErrorLog /var/log/httpd/soul-bible-error.log
    CustomLog /var/log/httpd/soul-bible-access.log combined
</VirtualHost>
