services:
  soul-bible-backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      SOUL_USAGE_LEDGER: sqlite
      SOUL_USAGE_DB_PATH: /app/cost-data/ai_usage.sqlite
    volumes:
      - soul-bible-cost-data:/app/cost-data
      - onaria-admin-secrets:/app/data/admin-secrets
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  soul-bible-cost-data:
  onaria-admin-secrets:
