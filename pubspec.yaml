name: onaria
description: 감정 기반 AI 신앙 대화 onaria MVP 앱.
version: 0.4.0+5
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  flutter_tts: ^4.2.5
  http: ^1.2.2
  meta: ^1.15.0
  share_plus: ^13.3.0
  shared_preferences: ^2.3.2
  speech_to_text: ^7.4.0
  timezone: ^0.11.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.8
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/bible_verses_ko.json
    - assets/prompts/system_prompt_ko.txt
    - assets/images/
